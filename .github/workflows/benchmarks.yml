name: Runtime validation
on: workflow_dispatch
jobs:
  source-check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run check
      # Run native browser/video benchmarks on a separately provisioned CEF host.
